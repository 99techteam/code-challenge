# Netlify build config — Problem 2 (Currency Swap)
# When repo root is this repo, set Base directory in Netlify UI to: src/problem2

[build]
  command   = "npm run build"
  publish   = "dist"

# SPA: serve index.html for all routes
[[redirects]]
  from      = "/*"
  to        = "/index.html"
  status    = 200

[build.environment]
  NODE_VERSION = "20"
