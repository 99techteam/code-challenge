version: "3.9"

services:
  db:
    image: mongo:7
    container_name: game-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: game-api
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: node dist/server.js

volumes:
  mongo_data: